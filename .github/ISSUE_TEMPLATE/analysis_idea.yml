name: Analysis idea or paper question
description: A check you'd like to see, or something in the paper that isn't clear
labels: [analysis]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see
    validations:
      required: true
  - type: textarea
    id: data
    attributes:
      label: Does it need new model runs?
      description: Many checks can be done on the stored per-item outputs in `experiments/lab_results/`.
